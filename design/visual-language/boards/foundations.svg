8" font-weight="400" fill="#9CAFB7">Не передавать смысл одним цветом: пиктограмма и краткий текст обязательны.</text><text x="52" y="1040" font-family="Noto Sans, sans-serif" font-size="24" font-weight="600" fill="#EEF5F4">05 / Движение</text><rect x="52" y="1070" width="345" height="154" rx="22" fill="#15232C"/><text x="76" y="1135" font-family="Noto Sans, sans-serif" font-size="36" font-weight="600" fill="#A3E5CD">180 мс</text><text x="76" y="1181" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" fill="#9CAFB7">Смена сцены</text><rect x="427" y="1070" width="345" height="154" rx="22" fill="#15232C"/><text x="451" y="1135" font-family="Noto Sans, sans-serif" font-size="36" font-weight="600" fill="#A3E5CD">2,4 с</text><text x="451" y="1181" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" fill="#9CAFB7">Минимальная выдержка</text><rect x="802" y="1070" width="345" height="154" rx="22" fill="#15232C"/><text x="826" y="1135" font-family="Noto Sans, sans-serif" font-size="36" font-weight="600" fill="#A3E5CD">120 мс</text><text x="826" y="1181" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" fill="#9CAFB7">Моргание</text><rect x="1177" y="1070" width="345" height="154" rx="22" fill="#15232C"/><text x="1201" y="1135" font-family="Noto Sans, sans-serif" font-size="36" font-weight="600" fill="#A3E5CD">0</text><text x="1201" y="1181" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" fill="#9CAFB7">Мигание ошибок</text><text x="52" y="1286" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#9CAFB7">Reduced motion: статичные глаза и замена без анимации. Не показывать ложный progress.</text><text x="52" y="1350" font-family="Noto Sans, sans-serif" font-size="14" font-weight="400" fill="#EFC98F">Предложение v1.0: критерии требуют проверки на физическом экране ESP32.</text></svg>